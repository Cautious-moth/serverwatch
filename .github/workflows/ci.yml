name: ServerWatch CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/serverwatch_deploy
          chmod 600 ~/.ssh/serverwatch_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy ServerWatch
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/serverwatch_deploy \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /home/ec2-user/serverwatch-deploy

          echo "Pulling latest application code..."
          git pull --ff-only origin main

          echo "Rebuilding and restarting ServerWatch..."
          docker compose up -d --build

          echo "Waiting for Docker health check..."

          for attempt in {1..18}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              serverwatch 2>/dev/null || true)

            if [[ "$STATUS" == "healthy" ]]; then
              echo "ServerWatch is healthy."
              docker compose ps
              exit 0
            fi

            if [[ "$STATUS" == "unhealthy" ]]; then
              echo "ServerWatch is unhealthy."
              docker logs --tail 50 serverwatch
              exit 1
            fi

            echo "Current status: ${STATUS:-starting}. Attempt $attempt/18"
            sleep 10
          done

          echo "Health check timed out."
          docker compose ps
          docker logs --tail 50 serverwatch
          exit 1
          REMOTE
